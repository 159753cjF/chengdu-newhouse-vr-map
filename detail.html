<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小区详情 · 阿飞懂房</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <style>
    :root {
      --afei-brand: #2C5F2D;
      --afei-accent: #B8422E;
      --afei-ink: #1A1C1E;
      --afei-muted: #6C7278;
      --afei-paper: #F7F5F2;
      --afei-line: #E4E0DA;
      --afei-on-brand: #F7F5F2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--afei-ink);
      background: var(--afei-paper);
    }
    .topbar {
      height: 54px; display: flex; align-items: center; gap: 14px;
      padding: 0 20px; border-bottom: 1px solid var(--afei-line);
      background: #F2EFE9; position: sticky; top: 0; z-index: 20;
    }
    .back-link { color: var(--afei-brand); text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .back-link:hover { text-decoration: underline; }
    .logo { font-weight: 700; font-size: 15px; color: var(--afei-brand); white-space: nowrap; }
    .top-actions { margin-left: auto; }

    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }
    .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 26px; line-height: 1.3; margin-bottom: 10px; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
    .badge {
      font-size: 12px; padding: 4px 12px; border-radius: 999px;
      background: #E8EFE6; color: var(--afei-brand); border: 1px solid #CDDBC9;
    }
    .badge.plate { background: #FFF1E8; color: var(--afei-accent); border-color: #F2D4C2; }
    .vr-open {
      flex: none;
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--afei-brand); color: var(--afei-on-brand);
      text-decoration: none; font-size: 14px; font-weight: 700;
      padding: 12px 22px; border-radius: 999px; margin-top: 6px;
      box-shadow: 0 4px 14px rgba(44,95,45,0.28);
    }
    .vr-open:hover { filter: brightness(1.1); }

    .section {
      margin-top: 26px;
      background: #FFFEFC; border: 1px solid var(--afei-line);
      border-radius: 14px; padding: 18px 20px;
    }
    .section h2 { font-size: 14px; color: var(--afei-muted); font-weight: 600; margin-bottom: 12px; letter-spacing: 0.04em; }
    .intro p { font-size: 15px; line-height: 1.85; color: var(--afei-ink); margin-bottom: 12px; }
    .intro p:last-child { margin-bottom: 0; }
    .todo {
      margin-top: 12px; padding: 10px 14px;
      background: #FFF8E6; border: 1px solid #EAD9A8; border-radius: 10px;
      font-size: 13px; color: #8A6D1F; line-height: 1.7;
    }
    .no-intro { font-size: 14px; color: var(--afei-muted); }

    #map { width: 100%; height: 280px; border-radius: 12px; overflow: hidden; border: 1px solid var(--afei-line); }
    .map-status { font-size: 12px; color: var(--afei-muted); margin-top: 8px; }

    .meta-list { font-size: 13px; line-height: 2; }
    .meta-list span { color: var(--afei-muted); margin-right: 8px; }
    .meta-list b { font-weight: 600; }
    .note { margin-top: 22px; font-size: 12px; color: var(--afei-muted); line-height: 1.7; }

    @media (max-width: 600px) {
      .topbar .logo { display: none; }
      h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="index.html">← 返回地图</a>
    <div class="logo">阿飞懂房 · 成都新房 VR 地图</div>
    <div class="top-actions"></div>
  </header>

  <main class="wrap">
    <div class="head">
      <div>
        <div class="badges" id="badges"></div>
        <h1 id="name">加载中…</h1>
      </div>
      <a class="vr-open" id="vr-open" href="#" target="_blank" rel="noopener">打开 VR 全景 ↗</a>
    </div>

    <div class="section">
      <h2>小区介绍</h2>
      <div class="intro" id="intro"></div>
    </div>

    <div class="section">
      <h2>位置</h2>
      <div id="map"></div>
      <div class="map-status" id="map-status"></div>
    </div>

    <div class="section">
      <h2>基本信息</h2>
      <div class="meta-list" id="meta"></div>
    </div>

    <p class="note" id="note"></p>
  </main>

  <script src="vendor/leaflet.js"></script>
  <script src="data/vr-map-data.js"></script>
  <script src="data/pos-overrides.js"></script>
  <script src="data/intros.js"></script>
  <script src="config.js"></script>
  <script>
    (function () {
      "use strict";
      function $(sel) { return document.querySelector(sel); }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      var scene = new URLSearchParams(location.search).get("scene") || "";
      var item = (window.VR_MAP_DATA || []).find(function (r) { return r.scene === scene; });
      document.title = (item ? item.name : "未找到") + " · 阿飞懂房";

      if (!item) {
        $("#name").textContent = "未找到该场景";
        $("#intro").innerHTML = '<p class="no-intro">链接无效或场景不存在。请回到地图重新选择。</p>';
        $("#vr-open").style.display = "none";
        return;
      }

      var intro = (window.VR_INTROS || {})[item.name] || "";
      var badgeHtml = '<span class="badge">' + esc(item.district) + "</span>";
      if (item.plate && item.plate !== "其它") badgeHtml += '<span class="badge plate">' + esc(item.plate) + "</span>";

      $("#badges").innerHTML = badgeHtml;
      $("#name").textContent = item.name;
      $("#vr-open").href = item.url;
      $("#meta").innerHTML =
        '<div><span>区县</span><b>' + esc(item.district) + "</b></div>" +
        '<div><span>板块</span><b>' + esc(item.plate || "—") + "</b></div>" +
        '<div><span>VR 场景</span><b>' + esc(item.scene) + "</b></div>";

      if (intro) {
        $("#intro").innerHTML = intro.split(/\n{1,}/).map(function (p) {
          var t = p.trim();
          if (!t) return "";
          if (t.indexOf("【待核实】") === 0) {
            return '<p class="todo">' + esc(t) + "</p>";
          }
          return "<p>" + esc(t).replace(/\*\*/g, "") + "</p>";
        }).join("");
        $("#note").textContent = "VR 内容来源：720zf「成都百亿像素（楼盘版）」，点击「打开 VR 全景」跳转原页面。小区介绍为草稿骨架，配套/户型/价格等信息以售楼处与官方口径为准。";
      } else {
        $("#intro").innerHTML = '<p class="no-intro">该小区暂未收录介绍，待补充。</p>';
        $("#note").textContent = "VR 内容来源：720zf「成都百亿像素（楼盘版）」。";
      }

      // 小地图（优先用位置修正）
      if (window.L) {
        var posOv = (window.VR_POS_OVERRIDES || {})[item.scene];
        var mLat = posOv ? posOv[0] : item.lat;
        var mLng = posOv ? posOv[1] : item.lng;
        var map = L.map("map", { center: [mLat, mLng], zoom: 15, zoomControl: true, scrollWheelZoom: false });
        window.__detailMap = map;
        var tk = window.TDT_TK;
        var subdomains = ["0", "1", "2", "3", "4", "5", "6", "7"];
        var highDpi = window.devicePixelRatio > 1;
        function tdtLayer(T) {
          var opts = { subdomains: subdomains, maxZoom: 18, minZoom: 3 };
          var url = "https://t{s}.tianditu.gov.cn/DataServer?T=" + T + "&x={x}&y={y}&l={z}&tk=" + tk;
          if (highDpi) opts = Object.assign(opts, { tileSize: 512, zoomOffset: -1, minZoom: 0 });
          return L.tileLayer(url, opts);
        }
        var vec = tdtLayer("vec_w");
        var cva = tdtLayer("cva_w");
        var base = L.layerGroup([vec, cva]).addTo(map);
        var ok = false, fail = 0;
        vec.on("tileload", function () { if (!ok) { ok = true; $("#map-status").textContent = "天地图 · " + item.district + " · " + item.name; } });
        vec.on("tileerror", function () {
          fail += 1;
          if (fail === 3 && !ok) {
            map.removeLayer(base);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
            $("#map-status").textContent = "OSM 底图（天地图加载失败回退）";
          }
        });
        setTimeout(function () { if (!ok) $("#map-status").textContent = "正在加载底图…"; }, 1200);
        L.marker([mLat, mLng]).addTo(map)
          .bindTooltip(item.name, { direction: "top", offset: [0, -12] })
          .openTooltip();
      } else {
        $("#map-status").textContent = "地图组件未加载";
      }
    })();
  </script>
</body>
</html>
